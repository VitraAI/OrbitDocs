name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The docs site's demo API is a snapshot of examples/nest-sample: fail when it's stale.
      - name: Demo spec is up to date
        run: |
          pnpm --filter @orbitdocs/docs demo:sync
          git diff --exit-code -- apps/docs/demo || (echo "::error::apps/docs/demo/travel.json is stale. Run 'pnpm --filter @orbitdocs/docs demo:sync' and commit it." && exit 1)
